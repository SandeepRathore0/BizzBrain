version: "3.8"

services:
  financial-data-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bizbrain-financial-data-service
    ports:
      - "8002:8002"
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - APP_HOST=0.0.0.0
      - APP_PORT=8002
      - DATABASE_URL=postgresql+asyncpg://financial_user:financial_pass@postgres:5432/financial_db
      - USER_SERVICE_BASE_URL=http://user-service-mock:8001
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET_NAME=receipts
      - S3_REGION=us-east-1
      - JWT_AUDIENCE=bizbrain
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - bizbrain-network

  postgres:
    image: postgres:16-alpine
    container_name: bizbrain-financial-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=financial_db
      - POSTGRES_USER=financial_user
      - POSTGRES_PASSWORD=financial_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financial_user -d financial_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bizbrain-network

  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: bizbrain-financial-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bizbrain-network

  user-service-mock:
    image: python:3.12-alpine
    container_name: bizbrain-user-service-mock
    ports:
      - "8001:8001"
    command: >
      sh -c "pip install fastapi uvicorn && python -c '
      from fastapi import FastAPI
      app = FastAPI()
      @app.get(\"/.well-known/jwks.json\")
      def jwks(): return {\"keys\": []}
      @app.get(\"/internal/v1/businesses/{business_id}\")
      def biz(business_id: str): return {\"data\": {\"business_id\": business_id, \"base_currency\": \"USD\", \"timezone\": \"UTC\", \"is_active\": True}}
      @app.post(\"/internal/v1/authz/check\")
      def authz(): return {\"data\": {\"allowed\": True}}
      import uvicorn
      uvicorn.run(app, host=\"0.0.0.0\", port=8001)
      '"
    networks:
      - bizbrain-network

volumes:
  postgres_data:
  minio_data:

networks:
  bizbrain-network:
    driver: bridge
